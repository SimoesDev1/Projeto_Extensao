{% extends 'base.html' %}
{% block title %}Editar Despesa{% endblock %}
{% block topbar_title %}<i class="bi bi-pencil" style="color:var(--amber);margin-right:8px;"></i>Editar Despesa{% endblock %}
{% block content %}

<div class="page-header">
    <div>
        <h1 class="page-title">Editar Despesa</h1>
        <p class="page-subtitle">Atualize os dados do registro selecionado</p>
    </div>
    <a href="{{ url_for('gastos.listar') }}" class="btn btn-outline btn-sm">
        <i class="bi bi-arrow-left"></i> Voltar
    </a>
</div>

<div class="form-card">
    <div class="form-card-header">
        <i class="bi bi-pencil-fill"></i>
        <span class="form-card-title">Dados da Despesa</span>
    </div>
    <div class="form-card-body">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Descrição <span style="color:var(--text-subtle);font-weight:400;">(opcional)</span></label>
                <input type="text" name="descricao" class="form-control"
                       value="{{ gasto.descricao or '' }}"
                       placeholder="Ex: Farinha, embalagens, taxa de entrega...">
            </div>

            <div class="form-group">
                <label class="form-label">Categoria <span style="color:var(--red);">*</span></label>
                <select name="id_categoria" class="form-select" required>
                    {% for cat in categorias %}
                    <option value="{{ cat.id_categoria }}"
                        {% if cat.id_categoria == gasto.id_categoria %}selected{% endif %}>
                        {{ cat.nome_categoria }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label">Valor (R$) <span style="color:var(--red);">*</span></label>
                    <input type="number" step="0.01" min="0.01" name="valor"
                           class="form-control" value="{{ gasto.valor }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Data <span style="color:var(--red);">*</span></label>
                    <input type="date" name="data_gasto" class="form-control"
                           value="{{ gasto.data_gasto }}" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Forma de Pagamento <span style="color:var(--red);">*</span></label>
                <select name="forma_pagamento" class="form-select" required>
                    {% for fp in formas %}
                    <option value="{{ fp }}" {% if gasto.forma_pagamento == fp %}selected{% endif %}>
                        {{ fp }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle-fill"></i> Salvar Alterações
                </button>
                <a href="{{ url_for('gastos.listar') }}" class="btn btn-outline">Cancelar</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
